events {}

http {
  include /etc/nginx/mime.types;

  # If Nginx can't tell a file's type, treat it as generic binary data.
  # 无法判断文件类型时，默认当作二进制文件。
  default_type  application/octet-stream;

  resolver 127.0.0.11 valid=30s;

  # map must be here (http context), not in server/location
  # ------------------------------------------------------------
  # map = a lookup table. It looks at $uri (the requested path) and
  # sets the variable $image_ct (image Content-Type) based on the file extension.
  # 根据文件后缀，自动设定正确的图片类型。
  #
  # ~*        = regex, case-insensitive (.PNG and .png both match)
  # \.        = a literal dot
  # jpe?g     = "jpg" or "jpeg" (? = the "e" is optional)
  # $         = end of the path
  # ------------------------------------------------------------
  map $uri $image_ct {
      default        "";                 # not an image -> empty
      ~*\.jpe?g$     "image/jpeg";
      ~*\.png$       "image/png";
      ~*\.gif$       "image/gif";
      ~*\.webp$      "image/webp";
      ~*\.svg$       "image/svg+xml";
  }

  server {
    listen 80;

    # Step 1: try the local uploads folder first
    location /uploads/ {
      try_files $uri @s3;
      root /var/www;
    }

    # Step 2: not found locally -> fetch from S3 (LocalStack)
    location @s3 {
      rewrite ^/uploads/(.*)$ /ecommerce-uploads/$1 break;
      proxy_pass http://localstack:4566;
      proxy_set_header Host $host;

      # Remove download headers
      # Hide S3's Content-Disposition (it can force a download),
      # then add our own: "inline" = show in the browser.
      # always = add it on EVERY response, including errors.
      proxy_hide_header Content-Disposition;
      add_header Content-Disposition "inline" always;

      # ------------------------------------------------------------
      # Fix the file type.
      # S3 may send a wrong Content-Type (e.g. application/octet-stream),
      # which makes the browser DOWNLOAD the image instead of showing it.
      # So: hide S3's type, and if it's an image, send the correct one from the map.
      # S3 可能给错文件类型，导致浏览器下载而不是显示；这里改成正确的图片类型。
      # ------------------------------------------------------------
      proxy_hide_header Content-Type;
        if ($image_ct != "") {
            add_header Content-Type $image_ct always;
        }
    }
  }
}